<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2a44">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Senaryo Defteri</title>
<style>
:root{--bg:#f3f4f8;--kart:#fff;--yazi:#1b1f2a;--ana:#3b4a8c;--anayazi:#fff;--gri:#d9dce6;--soluk:#6b7080;--kirmizi:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--kart:#1c2030;--yazi:#e8eaf3;--ana:#8fa0ff;--anayazi:#12141c;--gri:#2f3550;--soluk:#9aa0b8;--kirmizi:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--yazi);padding-bottom:50px}
#ust{position:sticky;top:0;z-index:5;background:var(--kart);border-bottom:1px solid var(--gri);padding:8px 10px}
#ustsatir{display:flex;align-items:center;gap:8px}
#baslik{flex:1;min-width:0;font-size:1.1rem;font-weight:700;border:0;background:transparent;color:var(--yazi)}
#kayit{font-size:.75rem;color:var(--soluk);white-space:nowrap}
#sekmeler{display:flex;gap:6px;overflow-x:auto;padding-top:6px}
.sekme,.cip{flex:0 0 auto;padding:8px 12px;border:1px solid var(--gri);border-radius:18px;background:var(--kart);color:var(--yazi);font-size:.9rem}
.sekme.sec,.cip.sec{background:var(--ana);color:var(--anayazi);border-color:var(--ana)}
.cip.yapi{border-color:var(--ana);font-weight:600}
#icerik{padding:10px;max-width:700px;margin:0 auto}
.grup{margin-bottom:6px}
.et{font-size:.72rem;letter-spacing:.05em;color:var(--soluk);margin:8px 0 2px}
.cips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
textarea,input[type=text],input[type=password],select{width:100%;padding:10px;font-size:1rem;border:1px solid var(--gri);border-radius:8px;background:var(--kart);color:var(--yazi);font-family:inherit}
textarea{min-height:110px;margin-top:8px}
.satir{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:12px 8px;font-size:.95rem;border:0;border-radius:8px;background:var(--ana);color:var(--anayazi)}
.btn.ikincil{background:var(--kart);color:var(--yazi);border:1px solid var(--gri)}
.btn.tehlike{background:var(--kart);color:var(--kirmizi);border:1px solid var(--kirmizi)}
.blok{background:var(--kart);border-radius:10px;padding:10px;margin:8px 0}
.bolum{font-weight:800;font-size:1.1rem;color:var(--ana)}
.sekans{font-weight:700;color:var(--ana)}
.sahne{font-weight:700}
.kar{text-align:center;font-weight:700;margin-top:4px}
.duy{text-align:center;font-style:italic;font-size:.9rem;color:var(--soluk)}
.dia{text-align:center;max-width:85%;margin:2px auto}
.gec{text-align:right;font-weight:700}
.etiket{font-weight:700;color:var(--ana)}
.araclar{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.araclar button{padding:6px 10px;border:1px solid var(--gri);border-radius:6px;background:var(--bg);color:var(--yazi)}
.soluk{color:var(--soluk);font-size:.9rem}
.sonuc{white-space:pre-wrap;background:var(--kart);border-radius:10px;padding:12px;margin-top:10px;line-height:1.45}
h3{margin:14px 0 4px}
#baski{display:none}
@media print{#app{display:none!important}#baski{display:block}}
</style>
</head>
<body>
<div id="app">
  <div id="ust">
    <div id="ustsatir"><input id="baslik" type="text" aria-label="Senaryo adı"><span id="kayit"></span></div>
    <div id="sekmeler"></div>
  </div>
  <div id="icerik"></div>
</div>
<div id="baski"></div>

<script>
/* ============ AYARLAR / SABİTLER ============ */
const KEY = 'senaryo_defteri_v1';
const API_KEY_ADI = 'senaryo_api_key';
const DUYGULAR = ['kızgın','üzgün','mutlu','korkmuş','şaşkın','sakin','alaycı','endişeli','fısıltıyla','bağırarak'];
const ATRAKSIYON = ['Kovalamaca','Kavga','Patlama','Silah sesi','Kaza','Düşme','Kaçış','Öpüşme'];
const GECISLER = ['KESME','KARARMA','SOLMA','YUMUŞAK GEÇİŞ','ZAMAN ATLAMASI'];
const MEKANLAR = ['İÇ.','DIŞ.','İÇ./DIŞ.'];
const ZAMANLAR = ['GÜN','GECE','AKŞAM','ŞAFAK'];
const SEKMELER = [['yaz','✍️ Yaz'],['senaryo','📜 Senaryo'],['karakter','👤 Karakterler'],['istatistik','📊 İstatistik'],['gorus','💬 Görüş/Özet'],['cikti','📄 Word/PDF'],['ayar','⚙️ Ayarlar']];
const SEV = {bolum:1, sekans:2, sahne:3};
const DK_DIYALOG = 150;   // dakikada konuşulan kelime (tahmini)
const DK_AKSIYON = 90;    // dakikada "okunan" aksiyon kelimesi (tahmini)

/* ============ YARDIMCILAR ============ */
const el = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9);
const BUY = s => String(s || '').toLocaleUpperCase('tr-TR');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kelime = s => (String(s || '').trim().match(/\S+/g) || []).length;
const kisalt = (t, n = 150) => t.length > n ? t.slice(0, n).trim() + '…' : t;

/* ============ VERİ ============ */
function yukle() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.bloklar)) return {baslik: d.baslik || 'Adsız Senaryo', karakterler: d.karakterler || [], bloklar: d.bloklar};
  } catch (e) {}
  return {baslik: 'Adsız Senaryo', karakterler: [], bloklar: []};
}
let S = yukle();
let ui = {tab:'yaz', kar:null, duygu:null, mekan:'İÇ.', zaman:'GÜN', metin:'', mik:false, kapsam:'tum', sonuc:''};

function kaydet() {
  const k = el('kayit');
  try { localStorage.setItem(KEY, JSON.stringify(S)); if (k) k.textContent = '✓ Kaydedildi'; }
  catch (e) { if (k) k.textContent = '⚠ Kaydedilemedi'; }
}
function bildir(t) { const k = el('kayit'); if (k) k.textContent = t; }

function ekle(blok) { S.bloklar.push(Object.assign({id: uid()}, blok)); kaydet(); render(); }
function karEkle(ad) {
  ad = ad.trim(); ad = ad.charAt(0).toLocaleUpperCase('tr-TR') + ad.slice(1);
  let k = S.karakterler.find(k => BUY(k.ad) === BUY(ad));
  if (!k) { k = {id: uid(), ad, gorunus: '', ruh: ''}; S.karakterler.push(k); }
  return k;
}

/* Bölüm / sekans / sahne numaralarını otomatik verir */
function yapi() {
  let b = 0, s = 0, h = 0;
  return S.bloklar.map(x => x.tip === 'bolum' ? ++b : x.tip === 'sekans' ? ++s : x.tip === 'sahne' ? ++h : 0);
}
function baslikMetni(x, n) {
  if (x.tip === 'bolum') return 'BÖLÜM ' + n + (x.ad ? ' — ' + BUY(x.ad) : '');
  if (x.tip === 'sekans') return 'SEKANS ' + n + (x.ad ? ' — ' + BUY(x.ad) : '');
  return 'SAHNE ' + n + ' — ' + x.ic + ' ' + BUY(x.yer) + ' — ' + x.zaman;
}

/* Başlık silinirse altındaki satırlar da silinir */
function silIdx(i) {
  const x = S.bloklar[i], sv = SEV[x.tip] || 99;
  let j = i + 1;
  if (sv < 99) while (j < S.bloklar.length && (SEV[S.bloklar[j].tip] || 99) > sv) j++;
  const adet = j - i;
  if (!confirm(adet > 1 ? 'Bu başlık ve altındaki ' + (adet - 1) + ' satır silinsin mi?' : 'Bu satır silinsin mi?')) return false;
  S.bloklar.splice(i, adet);
  return true;
}
function altSil(tur, no) {
  const tip = /sekans/i.test(tur) ? 'sekans' : /sahne/i.test(tur) ? 'sahne' : 'bolum';
  const n = yapi();
  const i = S.bloklar.findIndex((x, k) => x.tip === tip && n[k] === no);
  if (i < 0) { bildir('⚠ ' + tip + ' ' + no + ' bulunamadı'); return 0; }
  return silIdx(i) ? 1 : 0;
}

/* ============ OTOMATİK AYRIŞTIRMA ============ */
function otoIsle(metin) {
  let say = 0;
  for (const ham of metin.split(/\n+/)) {
    const satir = ham.trim();
    if (!satir) continue;
    const U = BUY(satir);
    let m;
    if ((m = satir.match(/^sil\s+(bölüm|bolum|sekans|sahne)\s+(\d+)/i))) { say += altSil(m[1], +m[2]); continue; }
    if (/^(son satırı sil|son satiri sil|sonu sil|sil)$/i.test(satir)) {
      if (S.bloklar.length && confirm('Son satır silinsin mi?')) { S.bloklar.pop(); say++; }
      continue;
    }
    if ((m = U.match(/^BÖLÜM(?=[\s:\-—]|$)\s*\d*\s*[:\-—]?\s*(.*)$/))) { S.bloklar.push({id: uid(), tip: 'bolum', ad: m[1]}); say++; continue; }
    if ((m = U.match(/^SEKANS(?=[\s:\-—]|$)\s*\d*\s*[:\-—]?\s*(.*)$/))) { S.bloklar.push({id: uid(), tip: 'sekans', ad: m[1]}); say++; continue; }
    if ((m = U.match(/^(KESME|KARARMA|SOLMA|YUMUŞAK GEÇİŞ|ZAMAN ATLAMASI)(?=[\s:.]|$)/))) { S.bloklar.push({id: uid(), tip: 'gecis', metin: m[1]}); say++; continue; }
    if ((m = U.match(/^(İÇ\/DIŞ|İÇ|DIŞ|IÇ|İC|IC|DİS|DIS)(\.?)\s+(.+)$/))) {
      let yer = m[3], zaman = ui.zaman;
      const zm = yer.match(/^(.*?)\s*[-–—]\s*(GÜN|GECE|AKŞAM|ŞAFAK)$/);
      if (zm) { yer = zm[1]; zaman = zm[2]; }
      if (m[2] || zm) {
        const ic = m[1].includes('/') ? 'İÇ./DIŞ.' : /^D/.test(m[1]) ? 'DIŞ.' : 'İÇ.';
        S.bloklar.push({id: uid(), tip: 'sahne', ic, yer: yer.trim(), zaman}); say++; continue;
      }
    }
    if ((m = satir.match(/^([A-Za-zÇĞİÖŞÜçğıöşü][A-Za-zÇĞİÖŞÜçğıöşü0-9 ]{0,28}?)\s*(?:\(([^)]{1,30})\))?\s*:\s*(.+)$/))) {
      const ad = m[1].trim();
      const bilinen = S.karakterler.some(k => BUY(k.ad) === BUY(ad));
      if (ad.split(/\s+/).length <= 3 && (bilinen || /^[A-ZÇĞİÖŞÜ]/.test(ad))) {
        const k = karEkle(ad);
        S.bloklar.push({id: uid(), tip: 'diyalog', kar: k.ad, duygu: (m[2] || ui.duygu || '').trim(), metin: m[3].trim()});
        say++; continue;
      }
    }
    S.bloklar.push({id: uid(), tip: 'aksiyon', metin: satir}); say++;
  }
  kaydet();
  return say;
}

/* ============ İSTATİSTİK ============ */
function istat() {
  const n = yapi(), kar = {}, sahneler = [];
  let cur = null, toplamK = 0;
  S.bloklar.forEach((x, i) => {
    const w = kelime(x.metin);
    if (x.tip === 'sahne') { cur = {bas: baslikMetni(x, n[i]), dil: 0, aks: 0}; sahneler.push(cur); }
    else if (x.tip === 'diyalog') {
      const k = kar[x.kar] || (kar[x.kar] = {kelime: 0, sahne: new Set(), duygu: {}});
      k.kelime += w; toplamK += w;
      if (cur) { k.sahne.add(sahneler.length); cur.dil += w; }
      if (x.duygu) k.duygu[x.duygu] = (k.duygu[x.duygu] || 0) + 1;
    }
    else if (x.tip === 'aksiyon' && cur) cur.aks += w;
  });
  sahneler.forEach(s => s.dk = s.dil / DK_DIYALOG + s.aks / DK_AKSIYON);
  return {kar, sahneler, toplamK, toplamDk: sahneler.reduce((a, s) => a + s.dk, 0)};
}

/* ============ KURAL TABANLI KONTROL (internetsiz) ============ */
function kontrol() {
  const o = [], n = yapi(), I = istat();
  const gr = []; let g = null, once = 0, hn = 0;
  S.bloklar.forEach((x, i) => {
    if (x.tip === 'sahne') { hn = n[i]; g = {no: hn, bl: []}; gr.push(g); }
    else if (x.tip === 'aksiyon' || x.tip === 'diyalog') {
      if (g) g.bl.push(x); else once++;
      const w = kelime(x.metin);
      if (x.tip === 'diyalog' && w > 60) o.push('Sahne ' + hn + ': ' + x.kar + ' çok uzun konuşuyor (' + w + ' kelime). Bölmeyi ya da araya hareket koymayı düşünün.');
      if (x.tip === 'aksiyon' && w > 70) o.push('Sahne ' + hn + ': Aksiyon paragrafı çok uzun (' + w + ' kelime). Kısa paragraflara bölün.');
      if (!x.metin || !x.metin.trim()) o.push('Sahne ' + hn + ': Boş bir satır var.');
    }
  });
  if (once) o.push('Sahne başlığı yokken ' + once + ' satır yazılmış. Önce "+ Sahne" ile bir sahne açın.');
  gr.forEach(s => {
    if (!s.bl.length) { o.push('Sahne ' + s.no + ' boş.'); return; }
    if (!s.bl.some(x => x.tip === 'aksiyon')) o.push('Sahne ' + s.no + ': Sadece konuşma var; ortamı ve hareketi anlatan aksiyon satırı ekleyin.');
    let seri = 0, mx = 0;
    s.bl.forEach(x => { seri = x.tip === 'diyalog' ? seri + 1 : 0; mx = Math.max(mx, seri); });
    if (mx >= 7) o.push('Sahne ' + s.no + ': ' + mx + ' konuşma üst üste; araya aksiyon koyarak ritmi kırın.');
  });
  S.karakterler.forEach(k => {
    if (!I.kar[k.ad]) o.push(k.ad + ' tanımlı ama hiç konuşmuyor.');
    if (!k.gorunus.trim() || !k.ruh.trim()) o.push(k.ad + ' için dış görünüş veya ruh hali boş (Karakterler sekmesi).');
  });
  if (I.toplamK > 100) Object.entries(I.kar).forEach(([ad, k]) => {
    if (k.kelime / I.toplamK > 0.6) o.push(ad + ' tüm konuşmaların %' + Math.round(k.kelime / I.toplamK * 100) + '’ini yapıyor. Diğer karakterlere de söz verin.');
  });
  if (!o.length) o.push('Kural tabanlı kontrolde sorun bulunamadı ✔');
  return o;
}

/* ============ ÖZET / METİN ============ */
function aralik() {
  if (ui.kapsam === 'tum') return [0, S.bloklar.length];
  const n = yapi();
  const bas = S.bloklar.findIndex((x, i) => x.tip === 'bolum' && n[i] === +ui.kapsam);
  if (bas < 0) return [0, S.bloklar.length];
  let son = bas + 1;
  while (son < S.bloklar.length && S.bloklar[son].tip !== 'bolum') son++;
  return [bas, son];
}
function ozetUret() {
  const [b, s] = aralik(), n = yapi(), out = [];
  let cur = null, sahneSay = 0;
  const bit = () => { if (cur) { out.push('  • ' + cur.bas + ': ' + (cur.kisi.size ? 'Karakterler: ' + [...cur.kisi].join(', ') + '. ' : '') + (cur.aks || '(aksiyon yok)')); cur = null; } };
  for (let i = b; i < s; i++) {
    const x = S.bloklar[i];
    if (x.tip === 'bolum' || x.tip === 'sekans') { bit(); out.push(baslikMetni(x, n[i])); }
    else if (x.tip === 'sahne') { bit(); sahneSay++; cur = {bas: baslikMetni(x, n[i]), kisi: new Set(), aks: ''}; }
    else if (cur && x.tip === 'diyalog') cur.kisi.add(x.kar);
    else if (cur && x.tip === 'aksiyon' && !cur.aks) cur.aks = kisalt(x.metin);
  }
  bit();
  if (!out.length) return 'Özetlenecek bir şey yok.';
  return out.join('\n') + '\n\nToplam ' + sahneSay + ' sahne.';
}
function scriptMetni(b, s) {
  const n = yapi(), out = [];
  S.karakterler.forEach(k => out.push('KARAKTER: ' + k.ad + (k.gorunus ? ' | Dış görünüş: ' + k.gorunus : '') + (k.ruh ? ' | Ruh hali: ' + k.ruh : '')));
  for (let i = b; i < s; i++) {
    const x = S.bloklar[i];
    if (SEV[x.tip]) out.push('\n' + baslikMetni(x, n[i]));
    else if (x.tip === 'aksiyon') out.push((x.etiket ? '[' + x.etiket + '] ' : '') + x.metin);
    else if (x.tip === 'diyalog') out.push(BUY(x.kar) + (x.duygu ? ' (' + x.duygu + ')' : '') + ': ' + x.metin);
    else out.push(x.metin);
  }
  return out.join('\n');
}
function okuMetni(x, n) {
  if (SEV[x.tip]) return baslikMetni(x, n);
  if (x.tip === 'diyalog') return x.kar + (x.duygu ? ', ' + x.duygu : '') + '. ' + x.metin;
  return x.metin;
}

/* ============ SESLİ OKUMA / YAZMA ============ */
function sesliOku(liste) {
  if (!('speechSynthesis' in window)) { alert('Bu cihaz sesli okumayı desteklemiyor.'); return; }
  speechSynthesis.cancel();
  liste.filter(Boolean).forEach(t => { const u = new SpeechSynthesisUtterance(t); u.lang = 'tr-TR'; speechSynthesis.speak(u); });
}
let rec = null;
function mikToggle() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Bu tarayıcı sesle yazmayı desteklemiyor. Android’de Chrome kullanın. Klavyedeki 🎤 tuşu da aynı işi görür.'); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'tr-TR'; rec.continuous = true; rec.interimResults = false;
  rec.onresult = e => {
    let t = '';
    for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) t += e.results[i][0].transcript + ' ';
    const g = el('giris');
    if (g && t.trim()) { g.value = (g.value ? g.value + ' ' : '') + t.trim(); ui.metin = g.value; }
  };
  rec.onend = () => { rec = null; ui.mik = false; if (ui.tab === 'yaz') render(); };
  rec.onerror = e => { bildir('⚠ Mikrofon: ' + e.error); };
  ui.mik = true; render();
  try { rec.start(); } catch (e) { rec = null; ui.mik = false; render(); }
}

/* ============ YAPAY ZEKÂ (isteğe bağlı, API anahtarı ister) ============ */
async function ai(sistem, kullanici) {
  const key = localStorage.getItem(API_KEY_ADI);
  if (!key) { alert('Önce Ayarlar sekmesine API anahtarınızı girin.'); return null; }
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
      body: JSON.stringify({model: 'claude-sonnet-5-5', max_tokens: 4000, system: sistem, messages: [{role: 'user', content: kullanici}]})
    });
    const d = await r.json();
    if (!r.ok) throw new Error((d.error && d.error.message) || r.status);
    return d.content.map(c => c.text || '').join('');
  } catch (e) { alert('Yapay zekâ hatası: ' + e.message); return null; }
}
async function aiGorusOzet(tur) {
  const [b, s] = aralik();
  const metin = scriptMetni(b, s).slice(0, 30000);
  if (!S.bloklar.length) { alert('Önce senaryoya bir şeyler yazın.'); return; }
  ui.sonuc = '⏳ Yapay zekâ çalışıyor…'; render();
  const sistem = tur === 'gorus'
    ? 'Sen deneyimli bir senaryo editörüsün. Türkçe yaz. Verilen senaryo hakkında dürüst görüş ver: akış, tempo, karakter sesleri, mantık/tutarlılık hataları, tekrar eden yerler. Her sorun için kısa bir düzeltme önerisi ekle. Kısa maddeler halinde yaz.'
    : 'Sen bir senaryo editörüsün. Türkçe yaz. Verilen senaryonun bölüm bölüm kısa ve net bir özetini çıkar, sonra tek paragraflık genel özet ekle.';
  const c = await ai(sistem, metin);
  ui.sonuc = c || ''; render();
}
async function aiCevir() {
  const t = giris();
  if (!t) { alert('Önce kutuya anlatmak istediğiniz şeyi yazın ya da 🎤 ile söyleyin.'); return; }
  bildir('⏳ Yapay zekâ çalışıyor…');
  const sistem = 'Kullanıcının anlattığı hikâye parçasını Türkçe senaryo bloklarına çevir. SADECE geçerli JSON döndür, başka metin yazma. Biçim: {"karakterler":[{"ad":"","gorunus":"","ruh":""}],"bloklar":[...]}. Blok türleri: {"tip":"bolum","ad":""}, {"tip":"sekans","ad":""}, {"tip":"sahne","ic":"İÇ." veya "DIŞ." veya "İÇ./DIŞ.","yer":"","zaman":"GÜN|GECE|AKŞAM|ŞAFAK"}, {"tip":"aksiyon","metin":""}, {"tip":"diyalog","kar":"","duygu":"","metin":""}, {"tip":"gecis","metin":"KESME|KARARMA|SOLMA|YUMUŞAK GEÇİŞ|ZAMAN ATLAMASI"}. Bölüm ve sekanslara anlamlı kısa adlar ver. Karakterlerin dış görünüşünü ve ruh halini kullanıcının verdiği bilgilerden yaz, uydurma bilgi ekleme. Mevcut karakterler: ' + (S.karakterler.map(k => k.ad).join(', ') || 'yok');
  const c = await ai(sistem, t);
  if (!c) { bildir(''); return; }
  try {
    const j = JSON.parse(c.slice(c.indexOf('{'), c.lastIndexOf('}') + 1));
    (j.karakterler || []).forEach(k => { if (!k.ad) return; const x = karEkle(k.ad); if (!x.gorunus && k.gorunus) x.gorunus = k.gorunus; if (!x.ruh && k.ruh) x.ruh = k.ruh; });
    let say = 0;
    (j.bloklar || []).forEach(b => {
      if (b.tip === 'bolum' || b.tip === 'sekans') S.bloklar.push({id: uid(), tip: b.tip, ad: b.ad || ''});
      else if (b.tip === 'sahne') S.bloklar.push({id: uid(), tip: 'sahne', ic: MEKANLAR.includes(b.ic) ? b.ic : 'İÇ.', yer: b.yer || '', zaman: ZAMANLAR.includes(b.zaman) ? b.zaman : 'GÜN'});
      else if (b.tip === 'aksiyon') S.bloklar.push({id: uid(), tip: 'aksiyon', metin: b.metin || ''});
      else if (b.tip === 'diyalog') { const k = karEkle(b.kar || 'Bilinmeyen'); S.bloklar.push({id: uid(), tip: 'diyalog', kar: k.ad, duygu: b.duygu || '', metin: b.metin || ''}); }
      else if (b.tip === 'gecis') S.bloklar.push({id: uid(), tip: 'gecis', metin: b.metin || 'KESME'});
      else return;
      say++;
    });
    temiz(); kaydet(); render(); bildir('✓ ' + say + ' satır eklendi');
  } catch (e) { alert('Yapay zekânın cevabı okunamadı. Tekrar deneyin.'); bildir(''); }
}

/* ============ WORD / PDF ÇIKTISI ============ */
const SN_CSS = '.sn-w{font-family:"Courier New",monospace;font-size:12pt;line-height:1.3}.sn-w p{margin:0 0 8pt}.sn-kapak{text-align:center;margin-top:150pt;page-break-after:always}.sn-kapak h1{font-size:24pt}.sn-h2{font-size:14pt;font-weight:bold;margin:12pt 0 6pt}.sn-b{font-size:16pt;font-weight:bold;text-align:center;margin:24pt 0 8pt}.sn-s{font-weight:bold;text-align:center;margin:14pt 0 6pt}.sn-sahne{font-weight:bold;margin:14pt 0 6pt}.sn-kar{margin:10pt 0 0 2.7in;font-weight:bold}.sn-duy{margin:0 0 0 2.2in;font-style:italic}.sn-dia{margin:0 1.3in 8pt 1.5in}.sn-gec{text-align:right;font-weight:bold;margin:10pt 0}';
function senaryoHTML() {
  const n = yapi();
  let h = '<div class="sn-w"><div class="sn-kapak"><h1>' + esc(BUY(S.baslik)) + '</h1><p>SENARYO</p></div>';
  if (S.karakterler.length) {
    h += '<div class="sn-h2">KARAKTERLER</div>';
    S.karakterler.forEach(k => { h += '<p><b>' + esc(BUY(k.ad)) + '</b>' + (k.gorunus ? ' — Dış görünüş: ' + esc(k.gorunus) : '') + (k.ruh ? ' — Ruh hali: ' + esc(k.ruh) : '') + '</p>'; });
  }
  let ilk = true;
  S.bloklar.forEach((x, i) => {
    if (x.tip === 'bolum') { h += '<div class="sn-b"' + (ilk ? '' : ' style="page-break-before:always"') + '>' + esc(baslikMetni(x, n[i])) + '</div>'; ilk = false; }
    else if (x.tip === 'sekans') h += '<div class="sn-s">' + esc(baslikMetni(x, n[i])) + '</div>';
    else if (x.tip === 'sahne') h += '<p class="sn-sahne">' + esc(baslikMetni(x, n[i])) + '</p>';
    else if (x.tip === 'aksiyon') h += '<p>' + (x.etiket ? '[' + esc(x.etiket) + '] ' : '') + esc(x.metin) + '</p>';
    else if (x.tip === 'diyalog') h += '<p class="sn-kar">' + esc(BUY(x.kar)) + '</p>' + (x.duygu ? '<p class="sn-duy">(' + esc(x.duygu) + ')</p>' : '') + '<p class="sn-dia">' + esc(x.metin) + '</p>';
    else h += '<p class="sn-gec">' + esc(x.metin) + '</p>';
  });
  return h + '</div>';
}
function dosyaAdi() { return (S.baslik.replace(/[^\wçğıöşüÇĞİÖŞÜ ]+/g, '').trim() || 'senaryo').replace(/\s+/g, '_'); }
function indir(ad, tur, icerik) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([icerik], {type: tur}));
  a.download = ad; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function wordIndir() {
  if (!S.bloklar.length) { alert('Önce senaryoya bir şeyler yazın.'); return; }
  const doc = '\ufeff<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>' + esc(S.baslik) + '</title><style>@page{size:21cm 29.7cm;margin:2.5cm}' + SN_CSS + '</style></head><body>' + senaryoHTML() + '</body></html>';
  indir(dosyaAdi() + '.doc', 'application/msword', doc);
}
function pdfYaz() {
  if (!S.bloklar.length) { alert('Önce senaryoya bir şeyler yazın.'); return; }
  el('baski').innerHTML = senaryoHTML();
  window.print();
}

/* ============ YEDEK ============ */
function yedekIndir() { indir(dosyaAdi() + '_yedek.json', 'application/json', JSON.stringify(S)); }
function yedekYukle(dosya) {
  if (!dosya) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.bloklar)) throw 0;
      if (!confirm('Şu anki senaryonun yerine yedek yüklensin mi?')) return;
      S = {baslik: d.baslik || 'Adsız Senaryo', karakterler: d.karakterler || [], bloklar: d.bloklar};
      kaydet(); render();
    } catch (e) { alert('Bu dosya geçerli bir yedek değil.'); }
  };
  r.readAsText(dosya);
}

/* ============ ARAYÜZ ============ */
const giris = () => ((el('giris') && el('giris').value) || '').trim();
const temiz = () => { const g = el('giris'); if (g) g.value = ''; ui.metin = ''; };
const karAd = () => { const k = S.karakterler.find(k => k.id === ui.kar); return k ? k.ad : ''; };
const cipler = (liste, secili, a) => liste.map(v => '<button class="cip ' + (secili === v ? 'sec' : '') + '" data-a="' + a + '" data-v="' + esc(v) + '">' + esc(v) + '</button>').join('');

function blokHTML(x, i, n, arac = true) {
  let g;
  if (SEV[x.tip]) g = '<div class="' + x.tip + '">' + esc(baslikMetni(x, n[i])) + '</div>';
  else if (x.tip === 'aksiyon') g = '<div>' + (x.etiket ? '<span class="etiket">[' + esc(x.etiket) + ']</span> ' : '') + esc(x.metin) + '</div>';
  else if (x.tip === 'diyalog') g = '<div class="kar">' + esc(BUY(x.kar)) + '</div>' + (x.duygu ? '<div class="duy">(' + esc(x.duygu) + ')</div>' : '') + '<div class="dia">' + esc(x.metin) + '</div>';
  else g = '<div class="gec">' + esc(x.metin) + '</div>';
  const a = arac ? '<div class="araclar"><button data-a="duzenle" data-v="' + x.id + '">✎</button><button data-a="oku" data-v="' + x.id + '">🔊</button><button data-a="yukari" data-v="' + x.id + '">↑</button><button data-a="asagi" data-v="' + x.id + '">↓</button><button data-a="sil" data-v="' + x.id + '">🗑</button></div>' : '';

    '<button class="cip" data-a="karYeni">+ Yeni karakter</button></div></div>' +

  '<div class="grup"><div class="et">ATRAKSİYON (kutudaki yazı açıklama olur)</div><div class="cips">' + cipler(ATRAKSIYON, null, 'atr') + '</div></div>' +
  '<div class="grup"><div class="et">GEÇİŞ</div><div class="cips">' + cipler(GECISLER, null, 'gecis') + '</div></div>' +
  '<textarea id="giris" placeholder="Buraya yazın ya da 🎤 ile söyleyin. Örnek:&#10;İç. Hastane koridoru - Gece&#10;Ali: Doktor nerede?&#10;Ali hızla koridorda yürür.">' + esc(ui.metin) + '</textarea>' +

  '<div class="satir"><button class="btn" data-a="otoEkle">⚡ Otomatik ekle</button><button class="btn ikincil" data-a="aiCevir">🤖 Yapay zekâ ile senaryolaştır</button></div>' +
  '<div class="et">SON EKLENENLER</div>' +

    (S.karakterler.map(k => '<div class="blok"><b>' + esc(BUY(k.ad)) + '</b>' +
      '<div class="et">DIŞ GÖRÜNÜŞ</div><textarea data-f="gorunus" data-id="' + k.id + '" style="min-height:70px">' + esc(k.gorunus) + '</textarea>' +
      '<div class="et">RUH HALİ / KARAKTER</div><textarea data-f="ruh" data-id="' + k.id + '" style="min-height:70px">' + esc(k.ruh) + '</textarea>' +

function sekmeIstatistik() {
  const I = istat();
  const adlar = new Set([...Object.keys(I.kar), ...S.karakterler.map(k => k.ad)]);
  const kartlar = [...adlar].map(ad => {
    const k = I.kar[ad] || {kelime: 0, sahne: new Set(), duygu: {}};
    const dk = k.kelime / DK_DIYALOG, sn = k.sahne.size;
    const sik = Object.entries(k.duygu).sort((a, b) => b[1] - a[1])[0];
    return {ad, kelime: k.kelime, html: '<div class="blok"><b>' + esc(BUY(ad)) + '</b><br>Toplam konuşma: ' + k.kelime + ' kelime (~' + dk.toFixed(1) + ' dk)<br>Konuştuğu sahne: ' + sn + '<br>Sahne başına ortalama: ' + (sn ? (dk / sn).toFixed(1) : '0') + ' dk' + (sik ? '<br>En sık duygu: ' + esc(sik[0]) + ' (' + sik[1] + ' kez)' : '') + '</div>'};
  }).sort((a, b) => b.kelime - a.kelime).map(x => x.html).join('');
  return '<div class="blok"><b>Genel</b><br>Sahne sayısı: ' + I.sahneler.length + '<br>Toplam konuşma: ' + I.toplamK + ' kelime<br>Tahmini süre: ~' + I.toplamDk.toFixed(1) + ' dk</div>' +
    '<h3>Karakterler</h3>' + (kartlar || '<p class="soluk">Henüz konuşma yok.</p>') +
    '<h3>Sahneler (tahmini süre)</h3><div class="blok">' + (I.sahneler.map(s => esc(s.bas) + ' — ~' + s.dk.toFixed(1) + ' dk').join('<br>') || '<span class="soluk">Sahne yok.</span>') + '</div>' +
    '<p class="soluk">Süreler tahminidir: konuşma dakikada ' + DK_DIYALOG + ', aksiyon dakikada ' + DK_AKSIYON + ' kelime sayılır.</p>';
}

function sekmeGorus() {
  const n = yapi();
  const bol = S.bloklar.map((x, i) => x.tip === 'bolum' ? '<option value="' + n[i] + '"' + (ui.kapsam == n[i] ? ' selected' : '') + '>' + esc(baslikMetni(x, n[i])) + '</option>' : '').join('');
  return '<div class="et">KAPSAM</div><select id="kapsam"><option value="tum">Tüm senaryo</option>' + bol + '</select>' +

    (ui.sonuc ? '<div class="sonuc">' + esc(ui.sonuc) + '</div><div class="satir"><button class="btn ikincil" data-a="okuSonuc">🔊 Sonucu oku</button><button class="btn ikincil" data-a="durdur">⏹ Durdur</button></div>' : '') +
    '<p class="soluk">🤖 butonları internet ve Ayarlar’daki API anahtarını ister. Diğerleri internetsiz çalışır.</p>';
}

function sekmeCikti() {
  return '<div class="blok">Senaryonuz standart senaryo düzeniyle (kapak, karakter listesi, bölümler, sahneler, konuşmalar) hazırlanır.</div>' +

function sekmeAyar() {
  return '<div class="blok"><b>Yapay zekâ anahtarı (isteğe bağlı)</b><div class="et">Sadece bu telefonda saklanır. Uygulamayı başkasına verirken anahtarınızı silin.</div>' +

    '<div class="satir"><button class="btn" data-a="yedekIndir">Yedeği indir</button><button class="btn ikincil" data-a="yedekSec">Yedeği yükle</button></div>' +

function render() {
  const g = el('giris'); if (g) ui.metin = g.value;
  el('baslik').value = S.baslik;
  el('sekmeler').innerHTML = SEKMELER.map(([k, ad]) => '<button class="sekme ' + (ui.tab === k ? 'sec' : '') + '" data-a="sekme" data-v="' + k + '">' + ad + '</button>').join('');
  const f = {yaz: sekmeYaz, senaryo: sekmeSenaryo, karakter: sekmeKarakter, istatistik: sekmeIstatistik, gorus: sekmeGorus, cikti: sekmeCikti, ayar: sekmeAyar}[ui.tab];
  el('icerik').innerHTML = f();
}

function duzenle(id) {
  const x = S.bloklar.find(x => x.id === id); if (!x) return;
  const alan = x.tip === 'sahne' ? 'yer' : (x.tip === 'bolum' || x.tip === 'sekans') ? 'ad' : 'metin';
  const yeni = prompt('Yeni metin:', x[alan] || '');
  if (yeni !== null) { x[alan] = yeni.trim(); kaydet(); render(); }
}

function islem(a, v) {
  switch (a) {
    case 'sekme': ui.tab = v; render(); window.scrollTo(0, 0); break;
    case 'kar': ui.kar = ui.kar === v ? null : v; render(); break;
    case 'duygu': ui.duygu = ui.duygu === v ? null : v; render(); break;
    case 'mekan': ui.mekan = v; render(); break;
    case 'zaman': ui.zaman = v; render(); break;
    case 'karYeni': { const ad = prompt('Karakterin adı:'); if (ad && ad.trim()) { ui.kar = karEkle(ad).id; kaydet(); render(); } break; }
    case 'yapi': {
      const t = giris();
      if (v === 'sahne') {
        if (!t) { alert('Önce yukarıdaki kutuya sahnenin yerini yazın.\nÖrnek: Hastane koridoru'); return; }
        temiz(); ekle({tip: 'sahne', ic: ui.mekan, yer: t, zaman: ui.zaman});
      } else { temiz(); ekle({tip: v, ad: t}); }
      break;
    }
    case 'atr': { const t = giris(); temiz(); ekle({tip: 'aksiyon', etiket: BUY(v), metin: t || (v + '.')}); break; }
    case 'gecis': ekle({tip: 'gecis', metin: v}); break;
    case 'aksiyonEkle': { const t = giris(); if (!t) { alert('Kutuya yazı yazın ya da 🎤 ile söyleyin.'); return; } temiz(); ekle({tip: 'aksiyon', metin: t}); break; }
    case 'diyalogEkle': {
      const t = giris(), k = S.karakterler.find(k => k.id === ui.kar);
      if (!k) { alert('Önce yukarıdan bir karakter seçin (ya da + Yeni karakter).'); return; }
      if (!t) { alert('Kutuya konuşmayı yazın ya da 🎤 ile söyleyin.'); return; }
      temiz(); ekle({tip: 'diyalog', kar: k.ad, duygu: ui.duygu || '', metin: t}); break;
    }
    case 'otoEkle': {
      const t = giris(); if (!t) { alert('Kutuya yazı yazın ya da 🎤 ile söyleyin.'); return; }
      temiz(); const sayi = otoIsle(t); render(); bildir('✓ ' + sayi + ' satır işlendi'); break;
    }
    case 'mik': mikToggle(); break;
    case 'aiCevir': aiCevir(); break;
    case 'sil': { const i = S.bloklar.findIndex(x => x.id === v); if (i >= 0 && silIdx(i)) { kaydet(); render(); } break; }
    case 'yukari': case 'asagi': {
      const i = S.bloklar.findIndex(x => x.id === v), j = a === 'yukari' ? i - 1 : i + 1;
      if (i >= 0 && j >= 0 && j < S.bloklar.length) { [S.bloklar[i], S.bloklar[j]] = [S.bloklar[j], S.bloklar[i]]; kaydet(); render(); }
      break;
    }
    case 'duzenle': duzenle(v); break;
    case 'oku': { const i = S.bloklar.findIndex(x => x.id === v); if (i >= 0) sesliOku([okuMetni(S.bloklar[i], yapi()[i])]); break; }
    case 'okuHepsi': { const n = yapi(); sesliOku(S.bloklar.map((x, i) => okuMetni(x, n[i]))); break; }
    case 'okuSonuc': sesliOku(ui.sonuc.split('\n')); break;
    case 'durdur': if ('speechSynthesis' in window) speechSynthesis.cancel(); break;
    case 'karSil': { const k = S.karakterler.find(k => k.id === v); if (k && confirm(k.ad + ' karakter listesinden silinsin mi? (Konuşmaları senaryoda kalır.)')) { S.karakterler = S.karakterler.filter(x => x.id !== v); if (ui.kar === v) ui.kar = null; kaydet(); render(); } break; }
    case 'kontrol': ui.sonuc = kontrol().map(s => '• ' + s).join('\n'); render(); break;
    case 'ozet': ui.sonuc = ozetUret(); render(); break;
    case 'aiGorus': aiGorusOzet('gorus'); break;
    case 'aiOzet': aiGorusOzet('ozet'); break;
    case 'word': wordIndir(); break;
    case 'pdf': pdfYaz(); break;
    case 'apiKaydet': localStorage.setItem(API_KEY_ADI, el('apikey').value.trim()); bildir('✓ Anahtar kaydedildi'); break;
    case 'apiSil': localStorage.removeItem(API_KEY_ADI); el('apikey').value = ''; bildir('Anahtar silindi'); break;
    case 'yedekIndir': yedekIndir(); break;
    case 'yedekSec': el('dosya').click(); break;
    case 'yeni': if (confirm('Tüm senaryo ve karakterler silinecek. Emin misiniz?') && confirm('Bu işlem geri alınamaz. Devam edilsin mi?')) { S = {baslik: 'Adsız Senaryo', karakterler: [], bloklar: []}; ui.kar = null; ui.sonuc = ''; kaydet(); render(); } break;
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (t) islem(t.dataset.a, t.dataset.v);
});
document.addEventListener('input', e => { if (e.target.id === 'giris') ui.metin = e.target.value; });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'baslik') { S.baslik = t.value.trim() || 'Adsız Senaryo'; kaydet(); }
  else if (t.dataset && t.dataset.f) { const k = S.karakterler.find(k => k.id === t.dataset.id); if (k) { k[t.dataset.f] = t.value; kaydet(); } }
  else if (t.id === 'kapsam') { ui.kapsam = t.value; render(); }
  else if (t.id === 'dosya') yedekYukle(t.files[0]);
});
window.addEventListener('beforeprint', () => { el('baski').innerHTML = senaryoHTML(); });

const stil = document.createElement('style'); stil.textContent = SN_CSS; document.head.appendChild(stil);
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
render(); kaydet();
</script>
</body>
</html>
