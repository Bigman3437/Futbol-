<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Futbol Tahmin</title>
<style>
:root{--bg:#eef3ef;--kart:#fff;--yazi:#17201b;--ana:#0b6e4f;--anayazi:#fff;--gri:#d5ded8;--soluk:#667068;--kirmizi:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a15;--kart:#18271f;--yazi:#e8f1ec;--ana:#3fbf8f;--anayazi:#0f1a15;--gri:#2a3d33;--soluk:#9bb0a4;--kirmizi:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--yazi);padding-bottom:50px}
#ust{position:sticky;top:0;z-index:5;background:var(--kart);border-bottom:1px solid var(--gri);padding:8px 10px}
#ustsatir{display:flex;align-items:center;justify-content:space-between;gap:8px}
#ustsatir b{font-size:1.1rem}
#mikbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--ana);color:var(--anayazi);font-size:1.4rem}
#mikbtn.acik{background:var(--kirmizi);color:#fff}
#sekmeler{display:flex;gap:6px;overflow-x:auto;padding-top:6px}
.sekme{flex:0 0 auto;padding:8px 12px;border:1px solid var(--gri);border-radius:18px;background:var(--kart);color:var(--yazi);font-size:.9rem}
.sekme.sec{background:var(--ana);color:var(--anayazi);border-color:var(--ana)}
#icerik{padding:10px;max-width:700px;margin:0 auto}
.kart{background:var(--kart);border-radius:10px;padding:12px;margin:8px 0}
.et{font-size:.75rem;color:var(--soluk);margin:10px 0 3px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:10px;font-size:1rem;border:1px solid var(--gri);border-radius:8px;background:var(--kart);color:var(--yazi);font-family:inherit}
input[type=range]{width:100%}
textarea{min-height:90px}
.satir{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:12px 8px;font-size:.95rem;border:0;border-radius:8px;background:var(--ana);color:var(--anayazi)}
.btn.ikincil{background:var(--kart);color:var(--yazi);border:1px solid var(--gri)}
.btn.tehlike{background:var(--kart);color:var(--kirmizi);border:1px solid var(--kirmizi)}
.skor{font-size:2rem;font-weight:800;text-align:center;margin:4px 0}
.bar{height:10px;background:var(--gri);border-radius:5px;overflow:hidden;margin:3px 0 10px}
.bar div{height:100%;background:var(--ana)}
.cevap{white-space:pre-wrap;border-left:4px solid var(--ana)}
.soluk{color:var(--soluk);font-size:.85rem}
.uyari{color:var(--kirmizi);font-size:.9rem}
.kaydir{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 5px;text-align:center;border-bottom:1px solid var(--gri);white-space:nowrap}
td.ad,th.ad{text-align:left}
tr.ilk td{font-weight:700}
.mac{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--gri);font-size:.92rem}
.mac button{border:1px solid var(--gri);background:var(--bg);color:var(--kirmizi);border-radius:6px;padding:4px 9px}
.sezonbas{background:var(--kart);border-radius:10px;padding:8px 12px;margin:8px 0}
.sezonsec{width:auto;border:0;background:transparent;font-size:1.3rem;font-weight:700;padding:2px 0;color:var(--yazi)}
.pt th{color:var(--soluk);font-weight:500;padding:12px 8px}
.pt td{padding:12px 8px}
.sk{position:sticky;left:0;background:var(--kart);text-align:left!important;min-width:175px}
.sk span{vertical-align:middle}
.sira{display:inline-block;width:28px;text-align:center;margin-right:6px;padding-left:8px}
.lg{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:.8rem;font-weight:700;margin-right:8px;vertical-align:middle}
.lej{font-size:.78rem;color:var(--soluk);margin:8px 2px}
.lej i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 6px;vertical-align:middle}
.mk{display:flex;background:var(--kart);border:1px solid var(--gri);border-radius:14px;margin:10px 0;overflow:hidden}
.mt{flex:1;padding:10px 14px;min-width:0}
.mr{display:flex;align-items:center;padding:7px 0;font-size:1.05rem}
.mr .mad{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr .msk{width:28px;text-align:right}
.mr .ok{width:22px;text-align:center;font-size:.8rem}
.mr.sol{color:var(--soluk)}
.mi{width:105px;border-left:1px solid var(--gri);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.9rem}
.mi button{border:1px solid var(--gri);background:var(--bg);color:var(--kirmizi);border-radius:6px;padding:3px 10px;font-size:.8rem}
#ligbar{padding-top:6px}
.s2{display:flex;justify-content:space-between;gap:10px;margin:5px 0;color:var(--soluk)}
.s2 b{color:var(--yazi);text-align:right}
.cubuk{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0}
.cubuk div{height:100%}
.fm{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:6px;font-size:.8rem;font-weight:700;margin-left:3px;color:#06210f}
.fm.G{background:#22c55e}.fm.B{background:#94a3b8}.fm.M{background:#ef4444;color:#fff}
</style>
</head>
<body>
<div id="app">
  <div id="ust">
    <div id="ustsatir"><b>⚽ Futbol Tahmin</b><button id="mikbtn" data-a="mik" aria-label="Sesli komut">🎤</button></div>
    <div id="sekmeler"></div><div id="ligbar"></div>
  </div>
  <div id="icerik"></div>
</div>

<script>
/* ============ YARDIMCILAR ============ */
const KEY = 'futbol_tahmin_v1';
const el = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s || '').toLocaleLowerCase('tr-TR').replace(/ı/g, 'i').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
const baslik = s => s.trim().split(/\s+/).map(w => w.charAt(0).toLocaleUpperCase('tr-TR') + w.slice(1).toLocaleLowerCase('tr-TR')).join(' ');
const bugun = () => new Date().toISOString().slice(0, 10);
const ALIAS = {gs: 'galatasaray', fb: 'fenerbahce', bjk: 'besiktas', ts: 'trabzonspor', buyuksehyr: 'basaksehir', istanbulbasaksehir: 'basaksehir', medipolbasaksehir: 'basaksehir'};
const SAYI = {'sıfır':'0','sifir':'0','bir':'1','iki':'2','üç':'3','uc':'3','dört':'4','dort':'4','beş':'5','bes':'5','altı':'6','alti':'6','yedi':'7','sekiz':'8','dokuz':'9','on':'10'};

/* ============ VERİ ============ */
const ayarBirlestir = a => ({yarim: (a && a.yarim) || 730, bolge: Object.assign({mavi: 2, turuncu: 1, yesil: 1, kirmizi: 3}, (a && a.bolge) || {})});
function yukle() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.maclar)) return {maclar: d.maclar, ayar: ayarBirlestir(d.ayar)};
  } catch (e) {}
  return {maclar: [], ayar: ayarBirlestir()};
}
let D = yukle();
let ui = {tab: 'puan', ev: '', dep: '', tahmin: null, cevap: '', sezon: 'son', say: 40, mik: false, mfiltre: '', lig: 'T1', o1: '', ox: '', o2: '', wo: 30, tk: ''};
function kaydet() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { if (!kaydet.u) { kaydet.u = 1; alert('Telefonun depolama alanı doldu, veri kaydedilemedi. Kullanmadığınız ligleri silin.'); } } }

function takimlar() {
  const m = new Map();
  M().forEach(x => [x.ev, x.dep].forEach(a => { const k = norm(a); if (k && !m.has(k)) m.set(k, a); }));
  return m;
}
function bul(ad) {
  let n = norm(ad); n = ALIAS[n] || n;
  if (!n) return null;
  const T = takimlar();
  if (T.has(n)) return T.get(n);
  if (n.length >= 4) for (const [k, a] of T) if (k.includes(n) || n.includes(k)) return a;
  return null;
}
function tarihCevir(s) {
  s = String(s || '').trim();
  if (/^\d{10}$/.test(s)) return new Date(+s * 1000).toISOString().slice(0, 10);
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return y + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2); }
  const t = Date.parse(s.split(' - ')[0] + ' UTC');
  return isNaN(t) ? null : new Date(t).toISOString().slice(0, 10);
}
function sezonOf(tarih) { const d = new Date(tarih), y = d.getUTCFullYear(); const b = d.getUTCMonth() >= 6 ? y : y - 1; return b + '-' + (b + 1); }
function sezonlar() { return [...new Set(M().map(m => sezonOf(m.tarih)))].sort().reverse(); }

/* ============ TAHMİN MOTORU (futbol7 modeli: zamana duyarlı Poisson / Dixon-Coles) ============ */
const LIGLER = {T1: 'Türkiye Süper Lig', E0: 'İngiltere Premier Lig', SP1: 'İspanya La Liga', I1: 'İtalya Serie A', D1: 'Almanya Bundesliga', F1: 'Fransa Ligue 1'};
const TRAD = {buyuksehyr: 'Başakşehir', fenerbahce: 'Fenerbahçe', besiktas: 'Beşiktaş', goztep: 'Göztepe', genclerbirligi: 'Gençlerbirliği', kasimpasa: 'Kasımpaşa', karagumruk: 'Karagümrük', umraniyespor: 'Ümraniyespor', eyupspor: 'Eyüpspor', gaziantep: 'Gaziantep FK'};
const EKSTRA = ['hs', 'as', 'hst', 'ast', 'hf', 'af', 'hc', 'ac', 'hy', 'ay', 'hr', 'ar'];
const trAd = a => TRAD[norm(a)] || a;
const M = () => D.maclar.filter(m => (m.lig || 'T1') === ui.lig);
const mkey = m => (m.lig || 'T1') + '|' + m.tarih + '|' + norm(m.ev) + '|' + norm(m.dep);
const ligOf = ad => { const m = String(ad).toUpperCase().match(/^(T1|E0|SP1|I1|D1|F1)[_\-. ]/); return m ? m[1] : ui.lig; };
const xs = m => m.x ? String(m.x).split(',').map(v => v === '' ? null : +v) : [];
const tarihSirala = (a, b) => a.tarih.localeCompare(b.tarih);
const SAY = ['sıfır', 'bir', 'iki', 'üç', 'dört', 'beş', 'altı', 'yedi', 'sekiz', 'dokuz'];
const YON = ['sıfıra', 'bire', 'ikiye', 'üçe', 'dörde', 'beşe', 'altıya', 'yediye', 'sekize', 'dokuza'];
const ses = (x, d = 1) => Number(x).toFixed(d).replace('.', ' virgül ');
const skorOku = s => (YON[s[0]] || s[0]) + ' ' + (SAY[s[1]] || s[1]);

function modelKur(ms, yarim, K = 3) {
  const now = Date.now(), ag = [], son = {};
  let tw = 0, sh = 0, sa = 0;
  ms.forEach(m => {
    const t = Date.parse(m.tarih), w = Math.pow(0.5, Math.max((now - t) / 864e5, 0) / yarim), a = norm(m.ev), b = norm(m.dep);
    ag.push([a, b, m.eg, m.dg, w]); tw += w; sh += w * m.eg; sa += w * m.dg;
    [a, b].forEach(k => { if (!son[k] || t > son[k]) son[k] = t; });
  });
  const muH = sh / tw, muA = sa / tw, T = Object.keys(son), att = {}, sav = {};
  T.forEach(t => { att[t] = 1; sav[t] = 1; });
  for (let it = 0; it < 30; it++) {
    const na = {}, da = {}, ns = {}, ds = {};
    T.forEach(t => { na[t] = da[t] = ns[t] = ds[t] = K; });
    ag.forEach(([ev, dep, hg, gg, w]) => {
      na[ev] += w * hg; da[ev] += w * muH * sav[dep];
      na[dep] += w * gg; da[dep] += w * muA * sav[ev];
      ns[ev] += w * gg; ds[ev] += w * muA * att[dep];
      ns[dep] += w * hg; ds[dep] += w * muH * att[ev];
    });
    const a2 = {}, s2 = {}; let oa = 0, os = 0;
    T.forEach(t => { a2[t] = na[t] / da[t]; s2[t] = ns[t] / ds[t]; oa += a2[t]; os += s2[t]; });
    oa /= T.length; os /= T.length;
    T.forEach(t => { att[t] = a2[t] / oa; sav[t] = s2[t] / os; });
  }
  return {muH, muA, att, sav};
}
function skorMatrisi(lh, la, rho = -0.06, n = 9) {
  const pois = (l, x) => { let f = 1; for (let i = 2; i <= x; i++) f *= i; return Math.exp(-l) * Math.pow(l, x) / f; };
  const X = [];
  for (let i = 0; i < n; i++) { X.push([]); for (let j = 0; j < n; j++) X[i].push(pois(lh, i) * pois(la, j)); }
  X[0][0] *= 1 - lh * la * rho; X[0][1] *= 1 + lh * rho; X[1][0] *= 1 + la * rho; X[1][1] *= 1 - rho;
  let s = 0; X.forEach(r => r.forEach(v => s += v));
  return X.map(r => r.map(v => v / s));
}
const modelOnbellek = {};
function modelAl() {
  const ms = M();
  if (ms.length < 50) return null;
  const key = ms.length + '|' + D.ayar.yarim;
  if (!modelOnbellek[ui.lig] || modelOnbellek[ui.lig][0] !== key) modelOnbellek[ui.lig] = [key, modelKur(ms, D.ayar.yarim)];
  return modelOnbellek[ui.lig][1];
}
function oranOlas(o1, ox, o2) {
  const o = [o1, ox, o2].map(x => parseFloat(String(x).replace(',', '.')));
  if (o.some(isNaN) || Math.min(...o) <= 1) return null;
  const p = o.map(x => 1 / x), s = p[0] + p[1] + p[2];
  return p.map(x => x / s);
}
function formHarf(ms, ad, adet = 5) {
  const k = norm(ad);
  return ms.filter(m => norm(m.ev) === k || norm(m.dep) === k).sort(tarihSirala).slice(-adet).map(m => {
    const ev = norm(m.ev) === k, gf = ev ? m.eg : m.dg, ga = ev ? m.dg : m.eg;
    return gf > ga ? 'G' : gf === ga ? 'B' : 'M';
  });
}
function tahminYap(evAd, depAd, oranlar, wOran) {
  const m = modelAl();
  if (!m) return {hata: 'Bu lig için en az 50 maç gerekir. Veri sekmesinden CSV dosyalarını yükleyin.'};
  const ke = norm(evAd), kd = norm(depAd);
  if (ke === kd) return {hata: 'İki takım aynı olamaz.'};
  if (!(ke in m.att) || !(kd in m.att)) return {hata: 'Takım verilerde bulunamadı.'};
  const lh = m.muH * m.att[ke] * m.sav[kd], la = m.muA * m.att[kd] * m.sav[ke];
  const X = skorMatrisi(lh, la), n = X.length, liste = [];
  let p1 = 0, px = 0, p2 = 0, u25 = 0, kg = 0;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const p = X[i][j]; liste.push([p, i, j]);
    if (i > j) p1 += p; else if (i === j) px += p; else p2 += p;
    if (i + j >= 3) u25 += p;
    if (i > 0 && j > 0) kg += p;
  }
  const model = [p1, px, p2], kul = [];
  let fin = model;
  const po = oranlar ? oranOlas(...oranlar) : null;
  if (po) { const w = Math.min(Math.max(+wOran || 0, 0), 0.9); fin = model.map((a, i) => (1 - w) * a + w * po[i]); kul.push('bahis oranları'); }
  const si = fin.indexOf(Math.max(...fin));
  liste.sort((a, b) => b[0] - a[0]);
  const en = liste.find(x => (si === 0 && x[1] > x[2]) || (si === 1 && x[1] === x[2]) || (si === 2 && x[1] < x[2]));
  const ms = M();
  return {ev: evAd, dep: depAd, model: model.map(x => x * 100), final: fin.map(x => x * 100), sonuc_i: si, skor: [en[1], en[2]], skorP: en[0] * 100,
    diger: liste.slice(0, 5).map(x => x[1] + '-' + x[2] + ' (%' + (x[0] * 100).toFixed(1) + ')'), lh, la, ust25: u25 * 100, kg: kg * 100,
    formEv: formHarf(ms, evAd), formDep: formHarf(ms, depAd), kul};
}
function tahminMetni(r) {
  const f = r.final, ad = r.sonuc_i === 0 ? r.ev + ' kazanır' : r.sonuc_i === 1 ? 'beraberlik' : r.dep + ' kazanır';
  return r.ev + ', ' + r.dep + ' maçı tahmini. En olası sonuç: ' + ad + '. En olası skor ' + skorOku(r.skor) + '. İhtimaller: ' + r.ev + ' yüzde ' + ses(f[0], 0) + ', beraberlik yüzde ' + ses(f[1], 0) + ', ' + r.dep + ' yüzde ' + ses(f[2], 0) +
    '. Beklenen gol ' + ses(r.lh) + ', ' + ses(r.la) + '. İki buçuk üst ihtimali yüzde ' + ses(r.ust25, 0) + '. Karşılıklı gol ihtimali yüzde ' + ses(r.kg, 0) + '.';
}

/* ---- takım istatistiği ---- */
function ozet(ad, ms) {
  const k = norm(ad), n = ms.length, r = {mac: n, g: 0, b: 0, m: 0, at: 0, ye: 0, u25: 0, kg: 0, golsuz: 0, temiz: 0};
  const ex = {sari: [8, 9, 0, 0], kirmizi: [10, 11, 0, 0], korner: [6, 7, 0, 0], sut: [0, 1, 0, 0], isabetli: [2, 3, 0, 0], faul: [4, 5, 0, 0]};
  ms.forEach(m => {
    const ev = norm(m.ev) === k, gf = ev ? m.eg : m.dg, ga = ev ? m.dg : m.eg, x = xs(m);
    r.at += gf; r.ye += ga;
    if (gf > ga) r.g++; else if (gf === ga) r.b++; else r.m++;
    if (gf + ga >= 3) r.u25++;
    if (gf > 0 && ga > 0) r.kg++;
    if (gf === 0) r.golsuz++;
    if (ga === 0) r.temiz++;
    for (const e in ex) { const v = x[ev ? ex[e][0] : ex[e][1]]; if (v != null) { ex[e][2] += v; ex[e][3]++; } }
  });
  r.puan = n ? (3 * r.g + r.b) / n : 0; r.atO = n ? r.at / n : 0; r.yeO = n ? r.ye / n : 0;
  ['u25', 'kg', 'golsuz', 'temiz'].forEach(e => r[e + 'Y'] = n ? Math.round(100 * r[e] / n) : 0);
  for (const e in ex) r[e] = ex[e][3] ? {ort: ex[e][2] / ex[e][3], top: ex[e][2]} : null;
  return r;
}
function takimStat(ad) {
  const k = norm(ad), ms = M().filter(m => norm(m.ev) === k || norm(m.dep) === k).sort(tarihSirala);
  if (!ms.length) return {hata: 'Bu takım için veri yok.'};
  const b = new Date(), y = b.getMonth() >= 6 ? b.getFullYear() : b.getFullYear() - 1, sb = y + '-07-01';
  return {
    takim: ad, ilk: ms[0].tarih, tum: ozet(ad, ms), sezon: ozet(ad, ms.filter(m => m.tarih >= sb)),
    ev: ozet(ad, ms.filter(m => norm(m.ev) === k)), dep: ozet(ad, ms.filter(m => norm(m.dep) === k)),
    form: formHarf(M(), ad, 10),
    son: ms.slice(-8).reverse().map(m => { const ev = norm(m.ev) === k, gf = ev ? m.eg : m.dg, ga = ev ? m.dg : m.eg; return {t: m.tarih, rakip: ev ? m.dep : m.ev, yer: ev ? 'ev' : 'dep', skor: gf + '-' + ga, s: gf > ga ? 'G' : gf === ga ? 'B' : 'M'}; })
  };
}
function takimMetni(d) {
  const s = d.sezon, t = d.tum;
  let m = d.takim + '. ';
  if (s.mac) m += 'Bu sezon ' + s.mac + ' maçta ' + s.g + ' galibiyet, ' + s.b + ' beraberlik, ' + s.m + ' mağlubiyet. Maç başına ' + ses(s.atO, 2) + ' gol atıyor, ' + ses(s.yeO, 2) + ' gol yiyor. ';
  m += 'Kayıtlı ' + t.mac + ' maçta ' + t.g + ' galibiyet, ' + t.b + ' beraberlik, ' + t.m + ' mağlubiyet. ';
  if (t.sari) m += 'Maç başına ortalama ' + ses(t.sari.ort, 1) + ' sarı kart';
  if (t.sari && t.kirmizi) m += ' ve ' + ses(t.kirmizi.ort, 2) + ' kırmızı kart';
  return m + (t.sari ? ' görüyor.' : '');
}
function ligBar() {
  const say = {}; D.maclar.forEach(m => { const l = m.lig || 'T1'; say[l] = (say[l] || 0) + 1; });
  el('ligbar').innerHTML = '<select id="lig">' + Object.entries(LIGLER).map(([k, v]) => '<option value="' + k + '"' + (k === ui.lig ? ' selected' : '') + '>' + v + ' (' + (say[k] || 0) + ' maç)</option>').join('') + '</select>';
}

/* ============ PUAN DURUMU ============ */
function tablo(sezon) {
  const T = new Map();
  const t = a => { const k = norm(a); if (!T.has(k)) T.set(k, {ad: a, o: 0, g: 0, b: 0, m: 0, ag: 0, yg: 0, p: 0}); return T.get(k); };
  M().filter(m => sezon === 'tum' || sezonOf(m.tarih) === sezon).forEach(m => {
    const a = t(m.ev), b = t(m.dep);
    a.o++; b.o++; a.ag += m.eg; a.yg += m.dg; b.ag += m.dg; b.yg += m.eg;
    if (m.eg > m.dg) { a.g++; a.p += 3; b.m++; } else if (m.eg < m.dg) { b.g++; b.p += 3; a.m++; } else { a.b++; b.b++; a.p++; b.p++; }
  });
  return [...T.values()].sort((x, y) => y.p - x.p || (y.ag - y.yg) - (x.ag - x.yg) || y.ag - x.ag || x.ad.localeCompare(y.ad, 'tr'));
}
function aktifSezon() { return ui.sezon === 'son' ? (sezonlar()[0] || 'tum') : ui.sezon; }
function tabloMetni(limit = 18) {
  const s = aktifSezon(), L = tablo(s);
  if (!L.length) return 'Henüz maç verisi yok.';
  return sezonEt(s) + (s === 'tum' ? '' : ' sezonu') + ' puan durumu. ' + L.slice(0, limit).map((x, i) => (i + 1) + '. ' + x.ad + ', ' + x.o + ' maçta ' + x.p + ' puan').join('. ') + '.';
}
function siraMetni(ad) {
  const s = aktifSezon(), L = tablo(s), i = L.findIndex(x => norm(x.ad) === norm(ad));
  if (i < 0) return ad + ' için ' + sezonEt(s) + ' sezonunda maç yok.';
  const x = L[i];
  return ad + ', ' + sezonEt(s) + ' sezonunda ' + (i + 1) + '. sırada. ' + x.o + ' maçta ' + x.g + ' galibiyet, ' + x.b + ' beraberlik, ' + x.m + ' mağlubiyet, ' + x.p + ' puan.';
}
function sonMaclarMetni(ad, n) {
  const k = ad ? norm(ad) : '';
  const L = M().filter(m => !k || norm(m.ev) === k || norm(m.dep) === k).sort((a, b) => b.tarih.localeCompare(a.tarih)).slice(0, n);
  if (!L.length) return 'Maç bulunamadı.';
  return (ad ? ad + ' son maçları. ' : 'Son maçlar. ') + L.map(m => m.ev + ' ' + m.eg + ', ' + m.dep + ' ' + m.dg).join('. ') + '.';
}

/* ============ MAÇ EKLEME / AYRIŞTIRMA ============ */
function macEkle(tarih, ev, dep, eg, dg) { D.maclar.push({tarih, ev, dep, eg: +eg, dg: +dg, lig: ui.lig}); }
function sayiyaCevir(s) { return s.split(/\s+/).map(w => SAYI[w.toLocaleLowerCase('tr-TR')] || w).join(' '); }
function sonucParse(s) {
  let tarih = bugun(), m = s.match(/^(\d{4}-\d{2}-\d{2}|\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4})\s+(.*)$/);
  if (m) { tarih = tarihCevir(m[1]) || tarih; s = m[2]; }
  s = s.replace(/^(sonuç|sonuc|maç|mac|skor)\s+/i, '').trim();
  let r = s.match(/^(.+?)\s+(\d{1,2})\s*[-–:]\s*(\d{1,2})\s+(.+)$/);
  if (r) return {tarih, ev: r[1], eg: +r[2], dg: +r[3], dep: r[4]};
  r = s.match(/^(.+?)\s+(\d{1,2})\s+(.+?)\s+(\d{1,2})$/);
  if (r) return {tarih, ev: r[1], eg: +r[2], dep: r[3], dg: +r[4]};
  r = s.match(/^(.+?)\s+(\d{1,2})\s+(\d{1,2})\s+(.+)$/);
  if (r) return {tarih, ev: r[1], eg: +r[2], dg: +r[3], dep: r[4]};
  return null;
}
function adCoz(ad, sor) {
  const b = bul(ad); if (b) return b;
  const yeni = baslik(ad);
  if (sor && D.maclar.length && !confirm('"' + yeni + '" yeni takım olarak eklensin mi?')) return null;
  return yeni;
}
function sonucKaydet(p, sor) {
  const ev = adCoz(p.ev, sor), dep = adCoz(p.dep, sor);
  if (!ev || !dep) return 'Maç kaydedilmedi.';
  if (norm(ev) === norm(dep)) return 'İki takım aynı görünüyor, kaydedilmedi.';
  macEkle(p.tarih, ev, dep, p.eg, p.dg); kaydet();
  return 'Kaydedildi: ' + ev + ' ' + p.eg + ' - ' + p.dg + ' ' + dep + '.';
}

/* ============ CSV İÇE AKTARMA ============ */
function csvIsle(metin, lig) {
  lig = lig || ui.lig;
  const sat = metin.replace(/^\uFEFF/, '').split(/\r?\n/).filter(s => s.trim());
  if (sat.length < 2) return {ek: 0, at: 0, hata: 'Dosya boş görünüyor.'};
  const sep = sat[0].split(';').length > sat[0].split(',').length ? ';' : ',';
  const ayir = s => s.split(sep).map(x => x.replace(/^"|"$/g, '').trim());
  const bas = ayir(sat[0]).map(h => h.toLowerCase());
  const ix = (...a) => bas.findIndex(h => a.includes(h));
  const iD = ix('date', 'tarih', 'date_gmt', 'timestamp'), iH = ix('hometeam', 'home', 'ev', 'home_team_name', 'home team');
  const iA = ix('awayteam', 'away', 'deplasman', 'away_team_name', 'away team');
  const iG = ix('fthg', 'hg', 'home_team_goal_count', 'homegoals'), iB = ix('ftag', 'ag', 'away_team_goal_count', 'awaygoals');
  const iS = ix('status'), iX = EKSTRA.map(h => bas.indexOf(h));
  if (iH < 0 || iA < 0 || iG < 0 || iB < 0) return {ek: 0, at: 0, hata: 'Sütunlar tanınmadı (ev takımı, deplasman, gol sütunları gerekli).'};
  const var_ = new Set(D.maclar.filter(m => (m.lig || 'T1') === lig).map(m => m.tarih + '|' + norm(m.ev) + '|' + norm(m.dep)));
  let ek = 0, at = 0;
  for (let i = 1; i < sat.length; i++) {
    const c = ayir(sat[i]), eg = c[iG], dg = c[iB];
    if (!c[iH] || !c[iA] || eg === '' || dg === '' || eg === undefined || dg === undefined || isNaN(+eg) || isNaN(+dg) || +eg < 0) { at++; continue; }
    if (iS >= 0 && c[iS] && c[iS].toLowerCase() !== 'complete') { at++; continue; }
    const tarih = (iD >= 0 && tarihCevir(c[iD])) || bugun(), ev = trAd(c[iH]), dep = trAd(c[iA]);
    const k = tarih + '|' + norm(ev) + '|' + norm(dep);
    if (var_.has(k)) { at++; continue; }
    var_.add(k);
    const x = iX.map(j => j >= 0 && c[j] !== '' && c[j] !== undefined && !isNaN(+c[j]) ? +c[j] : '').join(',');
    D.maclar.push({tarih, ev, dep, eg: +eg, dg: +dg, lig, x: /\d/.test(x) ? x : undefined}); ek++;
  }
  kaydet();
  return {ek, at};
}

/* ============ SES ============ */
function konus(t) {
  if (!('speechSynthesis' in window) || !t) return;
  speechSynthesis.cancel();
  t.split(/(?<=[.!?])\s+/).forEach(p => { const u = new SpeechSynthesisUtterance(p); u.lang = 'tr-TR'; speechSynthesis.speak(u); });
}
function takimlarMetinde(n) {
  const bul_ = [];
  for (const [k, ad] of takimlar()) { if (k.length < 3) continue; const i = n.indexOf(k); if (i >= 0) bul_.push({i, k, ad}); }
  bul_.sort((a, b) => a.i - b.i || b.k.length - a.k.length);
  const sonuc = []; let son = -1;
  bul_.forEach(x => { if (x.i >= son) { sonuc.push(x.ad); son = x.i + x.k.length; } });
  return sonuc;
}
function ilkSayi(n) {
  const m = n.match(/ilk(\d+|bes|uc|dort|alti|yedi|sekiz|dokuz|on)/);
  if (!m) return 0;
  return {bes: 5, uc: 3, dort: 4, alti: 6, yedi: 7, sekiz: 8, dokuz: 9, on: 10}[m[1]] || +m[1];
}
function komut(t) {
  const n = norm(t);
  const p = sonucParse(t) || sonucParse(sayiyaCevir(t));
  if (p) return sonucKaydet(p, true);
  const tm = takimlarMetinde(n);
  if (tm.length === 1 && /istatistik|form|kart|korner/.test(n)) { const d = takimStat(tm[0]); if (!d.hata) { ui.tab = 'takim'; ui.tk = tm[0]; return takimMetni(d); } }
  if (tm.length === 1 && /kacinci|sira|puan|durum/.test(n)) { ui.tab = 'puan'; return siraMetni(tm[0]); }
  if (/sonmac|sonuc|maclar/.test(n)) { ui.tab = 'mac'; ui.mfiltre = tm[0] || ''; return sonMaclarMetni(tm[0] || '', 5); }
  if (/puan|tablo|siralama|ilk|lig/.test(n)) { ui.tab = 'puan'; return tabloMetni(ilkSayi(n) || 18); }
  if (tm.length >= 2) {
    ui.ev = tm[0]; ui.dep = tm[1]; ui.dev = 0; ui.ddep = 0; ui.tab = 'tahmin';
    const r = tahminYap(ui.ev, ui.dep, null, 0.3); ui.tahmin = r;
    return r.hata || tahminMetni(r);
  }
  if (tm.length === 1) { ui.tab = 'puan'; return siraMetni(tm[0]); }
  return 'Anlayamadım. Örnekler: "Galatasaray Fenerbahçe tahmin", "Galatasaray 3 Fenerbahçe 1", "puan durumu", "ilk beş", "Fenerbahçe kaçıncı sırada", "Galatasaray son maçları".';
}
let rec = null;
function mikToggle() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Bu tarayıcı sesli komutu desteklemiyor. Android’de Chrome kullanın.'); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'tr-TR'; rec.continuous = false; rec.interimResults = false;
  rec.onresult = e => {
    const t = e.results[0][0].transcript;
    const c = komut(t);
    ui.cevap = '🗣 “' + t + '”\n' + c;
    render(); konus(c);
  };
  rec.onerror = e => { ui.cevap = '⚠ Mikrofon hatası: ' + e.error; render(); };
  rec.onend = () => { rec = null; ui.mik = false; render(); };
  ui.mik = true; ui.cevap = '🎤 Dinliyorum…'; render();
  try { rec.start(); } catch (e) { rec = null; ui.mik = false; render(); }
}

const kisaTarih = t => { const d = new Date(t + 'T12:00:00Z'); return isNaN(d) ? t : d.getUTCDate() + '/' + (d.getUTCMonth() + 1) + ' ' + ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'][d.getUTCDay()]; };
function rozet(ad) {
  let h = 0; for (const c of norm(ad)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return '<span class="lg" style="background:hsl(' + h + ' 55% 42%)">' + esc(ad.trim().charAt(0).toLocaleUpperCase('tr-TR')) + '</span>';
}
function bolgeRenk(i, n) {

  if (i < b.mavi + b.turuncu + b.yesil) return '#2e9e57';
  if (i >= n - b.kirmizi) return '#e53935';
  return 'transparent';
}

    '<div class="satir"><button class="btn" data-a="macEkle">Ekle</button></div></div>' +
    '<div class="et">SONUÇLAR (' + M().length + ' maç kayıtlı)</div>' +
    '<select id="mfiltre"><option value="">Tüm takımlar</option>' + tk.map(a => '<option value="' + esc(a) + '"' + (f && norm(a) === f ? ' selected' : '') + '>' + esc(a) + '</option>').join('') + '</select>' +
    (son.map(macKarti).join('') || '<div class="kart soluk">Maç yok.</div>') +
    (liste.length > ui.say ? '<div class="satir"><button class="btn ikincil" data-a="dahaFazla">Daha fazla göster</button></div>' : '') +
    '<div class="satir"><button class="btn ikincil" data-a="okuMaclar">🔊 Son sonuçları oku</button></div>';
}

function sekmeVeri() {
  return '<div class="kart"><b>CSV dosyasından maç yükle</b><div class="et">football-data.co.uk sezon dosyalarını (Termux’taki futbol_veri klasöründeki T1_2526.csv gibi) buradan seçin. Lig, dosya adından otomatik anlaşılır (T1, E0, SP1, I1, D1, F1); birden fazla dosyayı aynı anda seçebilirsiniz.</div>' +
    '<div class="satir"><button class="btn" data-a="csvSec">CSV dosyası seç</button></div><input type="file" id="csv" accept=".csv,text/csv,text/plain" hidden multiple></div>' +
    '<div class="kart"><b>Toplu sonuç yapıştır</b><div class="et">Her satıra bir maç. Örnekler:<br>Galatasaray 3-1 Fenerbahçe<br>2025-10-03 Beşiktaş 2-2 Trabzonspor</div>' +
    '<textarea id="toplu" placeholder="Galatasaray 3-1 Fenerbahçe"></textarea><div class="satir"><button class="btn" data-a="topluEkle">Ekle</button></div></div>' +
    '<div class="kart"><b>Güncellik</b><div class="et">Eski maçlar tahminde daha az sayılır. Yarı ömür (gün): her bu kadar günde bir maçın ağırlığı yarıya iner. Küçük sayı = son maçlara daha çok önem.</div>' +
    '<input type="number" id="yarim" min="60" max="3650" value="' + D.ayar.yarim + '"></div>' +
    '<div class="kart"><b>Puan durumu renkleri</b><div class="et">Tabloda kaç takımın hangi renkle işaretleneceği. Küme düşme rengi alttaki takımlar içindir.</div>' +
    '<div class="satir"><div style="flex:1"><div class="et">MAVİ</div><input type="number" id="z_mavi" min="0" max="10" value="' + D.ayar.bolge.mavi + '"></div><div style="flex:1"><div class="et">TURUNCU</div><input type="number" id="z_turuncu" min="0" max="10" value="' + D.ayar.bolge.turuncu + '"></div></div>' +
    '<div class="satir"><div style="flex:1"><div class="et">YEŞİL</div><input type="number" id="z_yesil" min="0" max="10" value="' + D.ayar.bolge.yesil + '"></div><div style="flex:1"><div class="et">KIRMIZI (alttan)</div><input type="number" id="z_kirmizi" min="0" max="10" value="' + D.ayar.bolge.kirmizi + '"></div></div></div>' +
    '<div class="kart"><b>Yedek</b><div class="satir"><button class="btn" data-a="yedekIndir">Yedeği indir</button><button class="btn ikincil" data-a="yedekSec">Yedeği yükle</button></div><input type="file" id="yedek" accept=".json,application/json" hidden></div>' +
    '<div class="kart"><b>Tüm maçları sil</b><div class="satir"><button class="btn tehlike" data-a="hepsiniSil">Seçili ligin verilerini sil</button></div></div>';
}
function render() {
  ligBar();
  ['ev', 'dep'].forEach(k => { const e = el(k); if (e && ui.tab === 'tahmin') ui[k] = e.value; });
  el('mikbtn').className = ui.mik ? 'acik' : '';
  el('mikbtn').textContent = ui.mik ? '⏹' : '🎤';
  el('sekmeler').innerHTML = SEKMELER.map(([k, ad]) => '<button class="sekme ' + (ui.tab === k ? 'sec' : '') + '" data-a="sekme" data-v="' + k + '">' + ad + '</button>').join('');
  const f = {tahmin: sekmeTahmin, puan: sekmePuan, mac: sekmeMac, takim: sekmeTakim, veri: sekmeVeri}[ui.tab];
  el('icerik').innerHTML = (ui.cevap ? '<div class="kart cevap">' + esc(ui.cevap) + '</div>' : '') + f();
}

function indir(ad, tur, icerik) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([icerik], {type: tur}));
  a.download = ad; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function dosyaOku(f, cb) { const r = new FileReader(); r.onload = () => cb(r.result); r.readAsText(f); }

function islem(a, v) {
  switch (a) {
    case 'sekme': ui.tab = v; ui.cevap = ''; render(); window.scrollTo(0, 0); break;
    case 'mik': mikToggle(); break;
    case 'tahmin': {
      const ev = bul(ui.ev) || ui.ev, dep = bul(ui.dep) || ui.dep;
      ui.ev = ev; ui.dep = dep; ui.cevap = '';
      const o = [ui.o1, ui.ox, ui.o2].every(x => x) ? [ui.o1, ui.ox, ui.o2] : null;
      ui.tahmin = tahminYap(ev, dep, o, ui.wo / 100); render(); break;
    }
    case 'takimStat': { const a = bul(el('tkSec').value); ui.tk = a || ''; ui.cevap = a ? '' : 'Takım bulunamadı.'; render(); break; }
    case 'okuTakim': if (ui.tk) konus(takimMetni(takimStat(ui.tk))); break;
    case 'oku': if (ui.tahmin && !ui.tahmin.hata) konus(tahminMetni(ui.tahmin)); break;
    case 'okuTablo': konus(tabloMetni()); break;
    case 'okuMaclar': konus(sonMaclarMetni(ui.mfiltre, 6)); break;
    case 'durdur': if ('speechSynthesis' in window) speechSynthesis.cancel(); break;
    case 'macEkle': {
      const t = el('mt').value || bugun(), e = el('me').value.trim(), d = el('md').value.trim(), g1 = el('meg').value, g2 = el('mdg').value;
      if (!e || !d || g1 === '' || g2 === '') { alert('Takımları ve golleri doldurun.'); return; }
      ui.cevap = sonucKaydet({tarih: t, ev: e, dep: d, eg: +g1, dg: +g2}, true); render(); break;
    }
    case 'macSil': if (confirm('Bu maç silinsin mi?')) { D.maclar = D.maclar.filter(m => mkey(m) !== v); kaydet(); render(); } break;
    case 'dahaFazla': ui.say += 40; render(); break;
    case 'csvSec': el('csv').click(); break;
    case 'topluEkle': {
      const satirlar = el('toplu').value.split(/\n+/).map(s => s.trim()).filter(Boolean);
      let ek = 0, hata = 0;
      satirlar.forEach(s => { const p = sonucParse(s) || sonucParse(sayiyaCevir(s)); if (p) { const r = sonucKaydet(p, false); if (r.startsWith('Kaydedildi')) ek++; else hata++; } else hata++; });
      ui.cevap = ek + ' maç eklendi' + (hata ? ', ' + hata + ' satır anlaşılamadı' : '') + '.'; render(); break;
    }
    case 'yedekIndir': indir('futbol_yedek.json', 'application/json', JSON.stringify(D)); break;
    case 'yedekSec': el('yedek').click(); break;
    case 'hepsiniSil': if (confirm('Seçili ligin tüm maçları silinecek. Emin misiniz?') && confirm('Bu işlem geri alınamaz. Devam edilsin mi?')) { D.maclar = D.maclar.filter(m => (m.lig || 'T1') !== ui.lig); ui.tahmin = null; ui.tk = ''; kaydet(); render(); } break;
  }
}

document.addEventListener('click', e => { const t = e.target.closest('[data-a]'); if (t) islem(t.dataset.a, t.dataset.v); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ev') ui.ev = t.value;
  else if (t.id === 'dep') ui.dep = t.value;
  else if (t.id === 'o1' || t.id === 'ox' || t.id === 'o2') ui[t.id] = t.value;
  else if (t.id === 'wo') { ui.wo = +t.value; el('wo_v').textContent = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sezon') { ui.sezon = t.value; render(); }
  else if (t.id === 'lig') { ui.lig = t.value; ui.tahmin = null; ui.tk = ''; ui.ev = ''; ui.dep = ''; ui.mfiltre = ''; ui.sezon = 'son'; render(); }
  else if (t.id === 'mfiltre') { ui.mfiltre = t.value; ui.say = 40; render(); }
  else if (t.id && t.id.startsWith('z_')) { D.ayar.bolge[t.id.slice(2)] = Math.max(0, Math.min(10, +t.value || 0)); kaydet(); ui.cevap = 'Renk ayarı kaydedildi.'; render(); }
  else if (t.id === 'yarim') { D.ayar.yarim = Math.min(3650, Math.max(60, +t.value || 450)); kaydet(); ui.cevap = 'Güncellik kaydedildi.'; render(); }
  else if (t.id === 'csv') {
    const dosyalar = [...t.files]; let ek = 0, at = 0, bekle = dosyalar.length, hata = '';
    dosyalar.forEach(f => dosyaOku(f, txt => {
      const r = csvIsle(txt, ligOf(f.name)); ek += r.ek; at += r.at; if (r.hata) hata = r.hata;
      if (--bekle === 0) { ui.cevap = hata && !ek ? '⚠ ' + hata : ek + ' maç eklendi, ' + at + ' satır atlandı (tekrar ya da oynanmamış maç).'; render(); }
    }));
  }
  else if (t.id === 'yedek' && t.files[0]) dosyaOku(t.files[0], txt => {
    try { const d = JSON.parse(txt); if (!Array.isArray(d.maclar)) throw 0; if (!confirm('Mevcut veriler yedekle değiştirilsin mi?')) return; D = {maclar: d.maclar, ayar: ayarBirlestir(d.ayar)}; kaydet(); render(); }
    catch (er) { alert('Bu dosya geçerli bir yedek değil.'); }
  });
});

if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
render();
</script>
</body>
</html>
